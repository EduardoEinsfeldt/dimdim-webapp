<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#f7f8fc"/>
  <text x="32" y="40" font-family="Arial" font-size="22" fill="#1c1c1c">DimDim - arquitetura macro</text>
  <rect x="40" y="90" width="200" height="90" rx="8" fill="#0b5fff"/>
  <text x="140" y="130" text-anchor="middle" font-family="Arial" font-size="16" fill="#fff">Usuario</text>
  <text x="140" y="152" text-anchor="middle" font-family="Arial" font-size="13" fill="#dbe6ff">Navegador</text>
  <rect x="340" y="70" width="280" height="220" rx="12" fill="#e8eefc" stroke="#0b5fff"/>
  <text x="480" y="98" text-anchor="middle" font-family="Arial" font-size="14" fill="#0b5fff">Azure App Service (Linux, Java 17)</text>
  <rect x="370" y="120" width="220" height="70" rx="8" fill="#fff" stroke="#9bb4f0"/>
  <text x="480" y="150" text-anchor="middle" font-family="Arial" font-size="15" fill="#1c1c1c">Web App DimDim</text>
  <text x="480" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">Spring Boot + Thymeleaf</text>
  <rect x="370" y="205" width="220" height="60" rx="8" fill="#fff" stroke="#9bb4f0"/>
  <text x="480" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#1c1c1c">Application Insights</text>
  <rect x="700" y="120" width="220" height="100" rx="8" fill="#107c10"/>
  <text x="810" y="162" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">Azure SQL Database</text>
  <text x="810" y="184" text-anchor="middle" font-family="Arial" font-size="12" fill="#d9f2d9">conta 1—N transacao</text>
  <line x1="240" y1="135" x2="340" y2="135" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="170" x2="700" y2="170" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="32" y="340" font-family="Arial" font-size="14" fill="#333">Deploy: Azure CLI (az webapp deploy) a partir do JAR. Segredos somente em App Settings.</text>
  <text x="32" y="366" font-family="Arial" font-size="14" fill="#333">Persistencia: JDBC/JPA contra Azure SQL PaaS. DDL versionado em scripts/ddl.sql.</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
